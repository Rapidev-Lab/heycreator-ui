# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  cpu: 2
  memoryMiB: 1024

# Environment variables and secrets.
env:
  # API Keys - Stored as secrets in Cloud Secret Manager
  # To set up secrets, run:
  # echo -n "your_api_key" | gcloud secrets create RAPIDAPI_KEY --data-file=-
  - variable: RAPIDAPI_KEY
    secret: RAPIDAPI_KEY
    availability:
      - RUNTIME

  - variable: RAPIDAPI_KEY_2
    secret: RAPIDAPI_KEY_2
    availability:
      - RUNTIME

  - variable: APIFY_API_TOKEN
    secret: APIFY_API_TOKEN
    availability:
      - RUNTIME

  - variable: FIREBASE_SERVICE_ACCOUNT_BASE64
    secret: FIREBASE_SERVICE_ACCOUNT_BASE64
    availability:
      - RUNTIME

  - variable: INSTAGRAM_APP_SECRET
    secret: INSTAGRAM_APP_SECRET
    availability:
      - RUNTIME

  # API Host Configurations
  - variable: INSTAGRAM_API_HOST
    value: instagram120.p.rapidapi.com
    availability:
      - BUILD
      - RUNTIME

  - variable: INSTAGRAM_SEARCH_API_HOST
    value: instagram-premium-api-2023.p.rapidapi.com
    availability:
      - BUILD
